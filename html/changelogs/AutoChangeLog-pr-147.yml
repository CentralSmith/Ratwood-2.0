author: "mypingishuge"
delete-after: True
changes:
  - bugfix: "Using Grab intent on an occupied animal mount now targets its driver; empty mounts can be grabbed with combat mode on or off without automatically mounting them."
  - bugfix: "Grabbed riders can no longer steer their animal mount away until they break free or are released."
  - bugfix: "Tame mounts no longer add characters sharing their tile as enemies when hurt, avoiding hostility toward a rider knocked off by the hit."